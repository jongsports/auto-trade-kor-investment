name: 🚀 Deploy KOR Stock Trading Bot

on:
  push:
    branches:
      - main

  workflow_dispatch:

# ============================================================
# GitHub Repo Secrets 등록 필요:
#   APP_KEY / APP_SECRET / ACCOUNT_NUMBER (KIS OpenAPI)
#   DART_API_KEY
#   TELEGRAM_TOKEN / TELEGRAM_CHAT_ID
#   DB_HOST / DB_PORT / DB_NAME / DB_USER / DB_PASSWORD
# ============================================================

jobs:
  # ─── 1단계: 테스트 ─────────────────────────────────────────
  test:
    name: 🧪 Run Tests
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: 이미지 빌드
        run: docker compose build

      # 호스트 파이썬이 아니라 배포될 이미지 안에서 검사한다. 의존성 누락이나 import
      # 오류는 py_compile 로는 잡히지 않는다.
      - name: 전체 문법 검사
        run: docker run --rm kor-trade:latest python -m compileall -q .

      - name: 모듈 import 검사
        run: docker run --rm kor-trade:latest python -c "import main, run_backtest"

      - name: 단위 테스트 (네트워크 호출 없음)
        run: docker run --rm kor-trade:latest python -m unittest discover -s tests -t .

  # ─── 2단계: 배포 ───────────────────────────────────────────
  deploy:
    name: 🚀 Deploy
    runs-on: [self-hosted, Linux, X64]
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: 최신 코드 확인
        run: |
          echo "📦 브랜치: ${{ github.ref_name }}"
          echo "📝 커밋: ${{ github.sha }}"

      # 장중 재배포는 컨테이너를 재생성해 진행 중인 매매를 끊는다.
      # 급한 수정은 workflow_dispatch 로 수동 실행하면 이 검사를 건너뛴다.
      - name: 장중 배포 차단
        if: github.event_name == 'push'
        run: |
          now=$(TZ=Asia/Seoul date +%H%M)
          dow=$(TZ=Asia/Seoul date +%u)
          if [ "$dow" -le 5 ] && [ "$now" -ge 0850 ] && [ "$now" -le 1535 ]; then
            echo "❌ 장중(08:50~15:35)에는 자동 배포하지 않습니다. 장 마감 후 다시 실행하거나 수동 실행하세요."
            exit 1
          fi

      - name: .env 파일 생성 (GitHub Secrets → 파일)
        run: |
          printf "APP_KEY=%s\n" "${{ secrets.APP_KEY }}" > .env
          printf "APP_SECRET=%s\n" "${{ secrets.APP_SECRET }}" >> .env
          printf "ACCOUNT_NUMBER=%s\n" "${{ secrets.ACCOUNT_NUMBER }}" >> .env
          printf "DART_API_KEY=%s\n" "${{ secrets.DART_API_KEY }}" >> .env
          printf "TELEGRAM_TOKEN=%s\n" "${{ secrets.TELEGRAM_TOKEN }}" >> .env
          printf "TELEGRAM_CHAT_ID=%s\n" "${{ secrets.TELEGRAM_CHAT_ID }}" >> .env
          printf "DB_HOST=%s\n" "${{ secrets.DB_HOST }}" >> .env
          printf "DB_PORT=%s\n" "${{ secrets.DB_PORT }}" >> .env
          printf "DB_NAME=%s\n" "${{ secrets.DB_NAME }}" >> .env
          printf "DB_USER=%s\n" "${{ secrets.DB_USER }}" >> .env
          printf "DB_PASSWORD=%s\n" "${{ secrets.DB_PASSWORD }}" >> .env
          chmod 600 .env
          echo "✅ .env 생성 완료 ($(grep -c '=' .env)개 항목)"

      - name: 영구 데이터 디렉터리 및 파일 생성
        run: |
          mkdir -p /home/jongseung/kor-trade-data/logs
          mkdir -p /home/jongseung/kor-trade-data/data/backtest_cache
          mkdir -p /home/jongseung/kor-trade-data/data/state
          touch /home/jongseung/kor-trade-data/data/token.json
          touch /home/jongseung/kor-trade-data/data/screening_results.json
          touch /home/jongseung/kor-trade-data/data/foreign_streak.json
          touch /home/jongseung/kor-trade-data/data/strategy_performance.json
          touch /home/jongseung/kor-trade-data/data/strategy_stats.json
          touch /home/jongseung/kor-trade-data/data/holidays.json
          echo "✅ 데이터 디렉터리/파일 준비 완료"

      - name: Docker 이미지 빌드
        run: docker compose build

      - name: 봇 재시작
        run: docker compose up -d --force-recreate kor-trade-live

      - name: 사용하지 않는 이미지 정리
        run: docker image prune -f

      # 기동 직후 크래시 루프여도 `up -d` 는 성공한다. 잠시 뒤 실제로 떠 있는지 본다.
      - name: 배포 상태 확인
        run: |
          sleep 45
          docker compose ps
          status=$(docker inspect -f '{{.State.Status}}' kor-trade-live)
          restarts=$(docker inspect -f '{{.RestartCount}}' kor-trade-live)
          echo "status=$status restarts=$restarts"
          if [ "$status" != "running" ] || [ "$restarts" -gt 0 ]; then
            echo "❌ 컨테이너가 정상 기동하지 못했습니다."
            docker logs --tail 80 kor-trade-live
            exit 1
          fi
          if docker logs --since 45s kor-trade-live 2>&1 | grep -q "엔진이 예외로 종료됨"; then
            echo "❌ 엔진이 기동 중 예외로 종료됐습니다."
            docker logs --tail 80 kor-trade-live
            exit 1
          fi
          echo "✅ 배포 완료"

  # ─── 3단계: 결과 ───────────────────────────────────────────
  notify:
    name: 📢 Notify Result
    runs-on: [self-hosted, Linux, X64]
    needs: [test, deploy]
    if: always()

    steps:
      - name: Success
        if: ${{ needs.deploy.result == 'success' }}
        run: echo "✅ 배포 성공 - $(date '+%Y-%m-%d %H:%M:%S')"

      - name: Failure
        if: ${{ needs.deploy.result == 'failure' }}
        run: |
          echo "❌ 배포 실패! Actions 로그를 확인하세요."
          exit 1
